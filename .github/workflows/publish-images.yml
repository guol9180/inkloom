name: Build and publish images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: inkloom-image-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Resolve release SHA
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter '!@inkloom/desktop' typecheck
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/guol9180/inkloom-api:${{ steps.release.outputs.sha }}
            ghcr.io/guol9180/inkloom-api:latest
          cache-from: type=gha,scope=inkloom-api
          cache-to: type=gha,mode=max,scope=inkloom-api
      - name: Build and push Web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/web.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_ORIGIN=https://api.inkloom.imhgl.com
          tags: |
            ghcr.io/guol9180/inkloom-web:${{ steps.release.outputs.sha }}
            ghcr.io/guol9180/inkloom-web:latest
          cache-from: type=gha,scope=inkloom-web
          cache-to: type=gha,mode=max,scope=inkloom-web
