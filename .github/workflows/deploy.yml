name: Deploy Web MVP

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_CONFIGURED: ${{ secrets.INKLOOM_DEPLOY_HOST != '' }}
    concurrency:
      group: inkloom-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/guol9180/inkloom-api:${{ github.sha }}
            ghcr.io/guol9180/inkloom-api:latest
          cache-from: type=gha,scope=inkloom-api
          cache-to: type=gha,mode=max,scope=inkloom-api
      - name: Build and push Edge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_ORIGIN=https://api.inkloom.imhgl.com
          tags: |
            ghcr.io/guol9180/inkloom-edge:${{ github.sha }}
            ghcr.io/guol9180/inkloom-edge:latest
          cache-from: type=gha,scope=inkloom-edge
          cache-to: type=gha,mode=max,scope=inkloom-edge
      - name: Check deployment secrets
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.INKLOOM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.INKLOOM_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.INKLOOM_DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.INKLOOM_DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_SSH_KEY"
      - name: Upload release and restart containers
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.INKLOOM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.INKLOOM_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.INKLOOM_DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.INKLOOM_DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/inkloom_deploy
          chmod 600 ~/.ssh/inkloom_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/inkloom_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/deploy'"
          rsync -az \
            -e "ssh -i ~/.ssh/inkloom_deploy" \
            deploy/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
            ssh -i ~/.ssh/inkloom_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh -i ~/.ssh/inkloom_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && export INKLOOM_IMAGE_TAG='$GITHUB_SHA' && docker compose -f deploy/compose.yaml pull && docker compose -f deploy/compose.yaml up -d --remove-orphans"
          ssh -i ~/.ssh/inkloom_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker logout ghcr.io"
      - name: Verify production
        if: env.DEPLOY_CONFIGURED == 'true'
        run: pnpm verify:production
