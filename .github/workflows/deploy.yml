name: Deploy Web MVP

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_CONFIGURED: ${{ secrets.INKLOOM_DEPLOY_HOST != '' }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    concurrency:
      group: inkloom-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Resolve release SHA
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/guol9180/inkloom-api:${{ steps.release.outputs.sha }}
            ghcr.io/guol9180/inkloom-api:latest
          cache-from: type=gha,scope=inkloom-api
          cache-to: type=gha,mode=max,scope=inkloom-api
      - name: Build and push Edge image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/web.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_ORIGIN=https://api.inkloom.imhgl.com
          tags: |
            ghcr.io/guol9180/inkloom-edge:${{ steps.release.outputs.sha }}
            ghcr.io/guol9180/inkloom-edge:latest
          cache-from: type=gha,scope=inkloom-edge
          cache-to: type=gha,mode=max,scope=inkloom-edge
      - name: Check deployment secrets
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.INKLOOM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.INKLOOM_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.INKLOOM_DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.INKLOOM_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.INKLOOM_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
      - name: Configure deployment SSH
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.INKLOOM_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.INKLOOM_DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/inkloom_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/inkloom_deploy
      - name: Upload release and restart containers
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.INKLOOM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.INKLOOM_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.INKLOOM_DEPLOY_PATH }}
        run: |
          ssh_opts=(-i ~/.ssh/inkloom_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/deploy'"
          rsync -az \
            -e "ssh ${ssh_opts[*]}" \
            deploy/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/"
          printf '%s' "$GHCR_TOKEN" | \
            ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && export INKLOOM_IMAGE_TAG='${{ steps.release.outputs.sha }}' && docker compose -f deploy/compose.yaml pull && docker compose -f deploy/compose.yaml up -d --remove-orphans"
      - name: Log out of GHCR on production
        if: always() && env.DEPLOY_CONFIGURED == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.INKLOOM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.INKLOOM_DEPLOY_USER }}
        run: |
          ssh_opts=(-i ~/.ssh/inkloom_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker logout ghcr.io"
      - name: Verify production
        if: env.DEPLOY_CONFIGURED == 'true'
        run: pnpm verify:production
