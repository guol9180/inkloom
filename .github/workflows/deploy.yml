name: Deploy Web MVP

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: inkloom-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright test
      - name: Check deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.INKLOOM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.INKLOOM_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.INKLOOM_DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.INKLOOM_DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_SSH_KEY"
      - name: Upload release and restart containers
        env:
          DEPLOY_HOST: ${{ secrets.INKLOOM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.INKLOOM_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.INKLOOM_DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.INKLOOM_DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/inkloom_deploy
          chmod 600 ~/.ssh/inkloom_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -az \
            --exclude .git \
            --exclude node_modules \
            --exclude .inkloom \
            --exclude test-results \
            --exclude playwright-report \
            -e "ssh -i ~/.ssh/inkloom_deploy" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh -i ~/.ssh/inkloom_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f deploy/compose.yaml up -d --build"
      - name: Verify production
        run: pnpm verify:production
