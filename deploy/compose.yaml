name: inkloom

services:
  api:
    container_name: inkloom-api
    image: ghcr.io/guol9180/inkloom-api:${INKLOOM_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      INKLOOM_DATABASE_PATH: /data/inkloom.sqlite
      INKLOOM_WEB_ORIGINS: https://inkloom.imhgl.com
    expose:
      - "3001"
    volumes:
      - inkloom-data:/data
    read_only: true
    init: true
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    container_name: inkloom-edge
    image: ghcr.io/guol9180/inkloom-edge:${INKLOOM_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    init: true
    mem_limit: 128m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  inkloom-data:
    name: inkloom-data
  caddy-data:
    name: inkloom-caddy-data
  caddy-config:
    name: inkloom-caddy-config

networks:
  edge:
    name: inkloom-edge
